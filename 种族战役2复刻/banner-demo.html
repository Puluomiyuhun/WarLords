<main><small>WARLORDS · 原创兵种试验 01</small><h1>守望战旗兵</h1><p>保留原人类身体和动作，另绘蓝银战旗。出兵后，所在路线友军伤害 <b>+20%</b>、受到伤害 <b>−15%</b>。整行生效、不叠加；死亡或离场即失效。</p>
<div style="display:flex;align-items:center;gap:18px"><canvas id="bannerPortrait" style="width:140px;height:140px;flex:none" aria-label="商店战旗兵预览"></canvas><p>受激励士兵：脚下蓝色光环、身体旁上浮箭纹。战旗离场后消失；第6路保持无加成供对照。</p></div><div class="controls"><button id="reset">重置对照战场</button><button id="send">第 4 路加入战旗兵</button><button id="remove">移除第 4 路战旗兵</button><button id="pause">暂停</button><a href="index.html">进入正式游戏 / 商店</a></div><div id="status" role="status">加载原版素材…</div>

<p class="legend"><span><b>第 4 路</b>：可加入战旗，观察加成</span><span><b>第 6 路</b>：无战旗对照组</span></p><p>正式游戏中：选择「人类联盟」→「野战军备」→「添加新的单位」→「守望战旗兵」（1200 黄金）。单人战役与双人合作商店也可购买。试验场会每 8 秒自动补充双方同等部队，战旗兵需手动加入。</p></main>
