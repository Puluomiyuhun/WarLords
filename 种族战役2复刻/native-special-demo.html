<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医护与缚根猎手 · 原帧试做</title><style>body{background:#20291f;color:#ddd9c5;font:15px system-ui;margin:0}main{max-width:1050px;margin:25px auto;padding:0 18px}h1{font-size:25px}p{line-height:1.7}canvas{display:block;width:100%;background:#3d4735;margin:15px 0}button,a{color:#dfdac0;background:#364332;border:1px solid #7b805b;border-radius:3px;padding:9px 15px;cursor:pointer;text-decoration:none}nav{display:flex;gap:10px;flex-wrap:wrap}#status{color:#dbca86}</style><main><h1>战地医护 / 缚根猎手 · 第一批试做</h1><p>每组左侧是原版身体，右侧为新兵；使用完全相同的帧与锚点。只叠加药包、箭囊等道具。下方战场运行实际游戏规则。</p><nav><button data-pose="walk">行走对照</button><button data-pose="attack">施术 / 射箭</button><button data-pose="death">死亡对照</button><button id="pause">暂停</button><button id="step">逐帧查看</button><a href="index.html">回到游戏</a></nav><canvas id="poses" width="2000" height="620" aria-label="原版与新兵动作对照"></canvas><p>医护：1400金币，准备6.5秒，单次18治疗 / 7秒；不互相治疗。猎手：1300金币，准备6.5秒，弱箭伤，缚根2秒 / 7秒，目标5秒内不再受缚根。</p><nav><button id="emptyLane">无敌军治疗测试</button><button id="reset">重置试验战场</button><button id="wave">补充双方兵力</button><button id="wound">友军轻伤，观察治疗</button></nav><p id="status" role="status">正在载入原版素材…</p><canvas id="battle" width="1400" height="1000" aria-label="新专属兵试验战场"></canvas><p>第4路：医护与受伤剑士；第6路：缚根猎手与敌军骑兵。受疗出现浅绿标记，被缚根出现脚下藤环。本页不会覆盖战役存档。</p></main><script src="content.js?v=0.10.3-native-weapons"></script><script src="persian-sprites.js?v=0.10.3-native-weapons"></script><script src="persian-content.js?v=0.10.3-native-weapons"></script><script src="native-specials.js?v=0.10.3-native-weapons"></script><script src="native-reinforcements.js?v=0.10.3-native-weapons"></script><script src="finished-content.js?v=0.10.3-native-weapons"></script><script src="restoration-atlas.js?v=0.10.3-native-weapons"></script><script src="restoration-content.js?v=0.10.3-native-weapons"></script><script src="restoration-engine.js?v=0.10.3-native-weapon
