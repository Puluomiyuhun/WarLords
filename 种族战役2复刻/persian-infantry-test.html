<h1>波斯基础步兵 · 动作对照</h1><p>左侧原版人类，右侧波斯换装。保持原动作时间轴和命中时机，统一沙色短衣、暗青腰带、长裤与头巾。</p>
<select id="unit" aria-label="兵种"><option value="0">长矛兵</option><option value="1" selected>剑士</option><option value="2">弓箭手</option></select><select id="action" aria-label="动作"></select><button id="play">暂停</button><button id="step">下一帧</button><select id="speed" aria-label="播放速度"><option value="24">原速 24 帧/秒</option><option value="8" selected>慢速 8 帧/秒</option></select><label><input id="mirror" type="checkbox">反向</label><input id="seek" aria-label="逐帧查看" type="range" min="0" max="11" value="0"><span id="frame"></span>
<canvas id="view" width="1050" height="360"></canvas><p id="status">载入中…</p><small>可切换普通攻击、特殊动作和倒地。局部轮廓仍可能有生成偏差；长时间重复帧共用同一姿势，倒地后的停留段保持静止。</small><p><a href="persian-demo.html?v=infantry6">进入本地试验场</a> · <a href="persian-walk-test.html?v=5">藤盾卫士对照</a></p>
