# Game art is served directly, with validators and a persistent browser cache.
# JSON manifests remain revalidated; code and WebSocket routes use the existing proxy.
location ^~ /warlords2/assets/ {
    if ($scheme = http) { return 308 https://work.puluo.top$request_uri; }
    alias /opt/warlords2/releases/0.6/种族战役2复刻/assets/;
    autoindex off;
    gzip off;
    etag on;
    expires -1;
    if ($uri ~* "\.(png|jpg|mp3)$") { expires 30d; }
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}
