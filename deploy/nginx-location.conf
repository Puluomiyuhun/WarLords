# Add only inside the existing work.puluo.top server block.
# proxy_pass intentionally has no trailing slash: retain /warlords2/ upstream.
location = /warlords2 {
    return 308 https://work.puluo.top/warlords2/;
}
location ^~ /warlords2/ {
    if ($scheme = http) { return 308 https://work.puluo.top$request_uri; }
    proxy_pass http://127.0.0.1:18643;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}
